# The sandbox of the embedded Tor under sandy 2.4.1 on Linux. TorSandboxPolicy fills in the values
# of a start, written as TOML values: the paths of the Tor directory, the ports, the targets of the
# onion services and the environment of Tor. Everything else, and every fallback level, is decided
# here. sandy takes the first level this host can enforce and skips one only for a lasting
# shortfall of the host, never for a failure that can pass or a port another process holds
# (sandy README.md, "Fallback levels").
version = 1

[filesystem]
system = "minimal"
# Tor sees only its own paths; every path the policy does not make executable is mounted without
# execute, so the libraries of a bundled Tor are read_exec.
view = "policy"
read = @read@
read_exec = @read_exec@
read_write = [@data@]

[network]
# A loopback of its own: Tor leaves it only through the egress broker, to public addresses, with
# Socks5Proxy in its torrc. Bisq reaches the control and SOCKS ports through the exposed relays, and
# Tor reaches the onion services of Bisq through the forwarded ports.
ip = "private"
unix_sockets = "none"
egress = { port = @egress_port@, reach = "public" }
expose = [
  { listen = @control_listen@, port = @control_port@ },
  { listen = @socks_listen@, port = @socks_port@ },
]
forward = @forward@

[process]
# No child processes. Tor with pluggable transports, which are programs it starts, uses
# linux-transports.toml or linux-transports-direct.toml.
signals = "isolated"
children = "none"
end_with_parent = true

[environment]
set = @environment@

[linux]
path_metadata = "deny"

# Linux 5.13 to 6.11 with what the base needs besides the signal scope (user namespaces which
# sandy may use, and the fix of Landlock erratum 3 for the view): a PID namespace isolates the
# signals Landlock cannot. Tor may then start processes, which end with it.
[[fallback]]
name = "contained"
process.children = "contained"

# User namespaces restricted (Ubuntu 23.10 and newer, which Bisq never prepares with sandy setup)
# or turned off, or no fix of Landlock erratum 3: the network of the host, without the egress
# broker and without the view.
[[fallback]]
name = "host-network"
network.ip = "all"
network.egress = "none"
filesystem.view = "all"

# As host-network, below Landlock ABI 6: Tor can signal the processes of this user, and sandy does
# not end it with Bisq (Tor's owner check, and from the bootstrap on Bisq's ownership of the
# control connection, still do).
[[fallback]]
name = "host-network-signals"
network.ip = "all"
network.egress = "none"
filesystem.view = "all"
process.signals = "any"
process.end_with_parent = false
