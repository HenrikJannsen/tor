name: Build Tor

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize, closed ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 is arm64; macos-15-intel keeps Intel macOS coverage explicit.
        # A repository can set BUILD_LINUX_ONLY to true to build on Ubuntu only. The variable only selects one of the
        # two checked-in runner lists, so every runner label stays reviewed and verified.
        os: ${{ fromJSON(vars.BUILD_LINUX_ONLY == 'true' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15-intel", "macos-15", "windows-2025"]') }}

    runs-on: ${{ matrix.os }}
    # The build runs the tests. A test which hangs would otherwise hold the runner for the default limit of 6 hours.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Gradle wrapper checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c gradle/wrapper/gradle-wrapper.sha256
          else
            shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21.0.13'
          distribution: 'zulu'
          check-latest: false

      # "Verify Gradle wrapper checksums" compares the wrapper with checksums which this repository states itself.
      # setup-gradle checks gradle-wrapper.jar against the checksums which Gradle publishes; it is on by default, and set
      # here so that it stays on.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Build with Gradle
        shell: bash
        run: ./gradlew build

      # Bisq 1 builds with the configuration cache. The tasks which package the Tor bundle must store a cache entry,
      # reuse it, and with it create their outputs again after they were deleted.
      - name: Check the bundle tasks with the configuration cache
        shell: bash
        run: |
          ./gradlew --configuration-cache :tor:packageTorBinary
          ./gradlew --configuration-cache :tor:packageTorBinary | tee "$RUNNER_TEMP/cc-reuse.log"
          grep -q 'Configuration cache entry reused' "$RUNNER_TEMP/cc-reuse.log"
          rm -rf tor/build/tor_binary tor/build/generated/src/main/resources/tor.zip
          ./gradlew --configuration-cache :tor:packageTorBinary | tee "$RUNNER_TEMP/cc-recreate.log"
          grep -q 'Configuration cache entry reused' "$RUNNER_TEMP/cc-recreate.log"
          test -s tor/build/generated/src/main/resources/tor.zip

      # The report is regenerated by hand after a change of the dependencies or of the verification metadata. It
      # depends on neither the operating system nor the architecture, so one job checks that it is up to date.
      - name: Check the dependency signature report
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew dependencySignatureReport
          git diff --exit-code -- docs/dependency-signature-report.md

      # Every task of build must store its state in a configuration cache entry, except the tasks which resolve and
      # verify the dependencies in each invocation and are declared incompatible. The checks and the POM tasks must
      # also work from a reused entry.
      - name: Check the tasks of the build with the configuration cache
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew --configuration-cache --dry-run build
          tasks="verifyGithubActionsSecurity verifyGradleWrapperSecurity verifyBuildEnvironment generatePomFileForMavenJavaPublication"
          ./gradlew --configuration-cache $tasks
          ./gradlew --configuration-cache $tasks | tee "$RUNNER_TEMP/cc-checks.log"
          grep -q 'Configuration cache entry reused' "$RUNNER_TEMP/cc-checks.log"
